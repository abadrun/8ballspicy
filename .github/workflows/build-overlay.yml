name: Build authorized overlay source

on:
  workflow_dispatch:
  push:
    branches:
      - arena/01a0fb30-8ballspicy
    paths:
      - "ExistingIPAWorkspace/OverlaySource/**"
      - "ExistingIPAWorkspace/scripts/build-overlay-macos.sh"
      - ".github/workflows/build-overlay.yml"

permissions:
  contents: write

jobs:
  build-overlay:
    name: Test and build iOS overlay component
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode
        run: xcodebuild -version

      - name: Verify preserved baseline
        run: bash ExistingIPAWorkspace/Preservation/verify_original.sh

      - name: Run Swift package tests
        working-directory: ExistingIPAWorkspace/OverlaySource
        run: |
          set +e
          set -o pipefail
          swift test --parallel 2>&1 | tee "$RUNNER_TEMP/swift-test.log"
          status=${PIPESTATUS[0]}
          if [[ $status -ne 0 ]]; then
            message=$(tail -c 6000 "$RUNNER_TEMP/swift-test.log" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))')
            echo "::error title=Swift package test diagnostics::$message"
            exit "$status"
          fi

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ExistingIPAOverlay-test-diagnostics
          path: ${{ runner.temp }}/swift-test.log
          if-no-files-found: error
          retention-days: 7

      - name: Build unsigned iOS device component
        env:
          SKIP_TESTS: "1"
        run: |
          bash ExistingIPAWorkspace/scripts/build-overlay-macos.sh
          checksum=$(cat output/components/ExistingIPAOverlay-ios-device-build.zip.sha256)
          echo "::notice title=Unsigned iphoneos component checksum::$checksum"

      - name: Upload unsigned device component build
        uses: actions/upload-artifact@v4
        with:
          name: ExistingIPAOverlay-ios-device-build
          path: |
            output/components/ExistingIPAOverlay-ios-device-build.zip
            output/components/ExistingIPAOverlay-ios-device-build.zip.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Store validated device component under output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp output/components/ExistingIPAOverlay-ios-device-build.zip output/ExistingIPAOverlay-ios-device-build.zip
          cp output/components/ExistingIPAOverlay-ios-device-build.zip.sha256 output/ExistingIPAOverlay-ios-device-build.zip.sha256
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/ExistingIPAOverlay-ios-device-build.zip output/ExistingIPAOverlay-ios-device-build.zip.sha256
          if git diff --cached --quiet; then
            echo "Device artifact already tracked with no changes."
            exit 0
          fi
          git commit -m "Store validated iOS device component artifact"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
