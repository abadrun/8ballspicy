name: Build and test ExistingIPAOverlay

on:
  workflow_dispatch:
  push:
    branches:
      - arena/01a0fc96-8ballspicy
    paths:
      - "ExistingIPAWorkspace/OverlaySource/**"
      - "ExistingIPAWorkspace/SampleHost/**"
      - "ExistingIPAWorkspace/scripts/build-overlay-macos.sh"
      - "ExistingIPAWorkspace/scripts/create-reproducible-zip.py"
      - "ExistingIPAWorkspace/scripts/test-overlay-macos.sh"
      - "ExistingIPAWorkspace/scripts/validate-device-component.py"
      - "ExistingIPAWorkspace/scripts/validate-simulator-component.py"
      - "ExistingIPAWorkspace/scripts/validate-sample-host-*.py"
      - ".github/workflows/build-overlay.yml"

permissions:
  contents: read

jobs:
  test-and-build:
    name: Core, UI, host integration, and reproducible builds
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          uname -a

      - name: Validate source and scripts
        run: |
          set -euo pipefail
          python3 ExistingIPAWorkspace/OverlaySource/Tests/validate_source.py
          python3 ExistingIPAWorkspace/scripts/validate-sample-host-source.py
          python3 -m py_compile ExistingIPAWorkspace/scripts/*.py
          for script in ExistingIPAWorkspace/scripts/*.sh; do bash -n "$script"; done

      - name: Run Core, UI, lifecycle, resource, persistence, and sample-host tests
        run: bash ExistingIPAWorkspace/scripts/test-overlay-macos.sh

      - name: Build first reproducibility pass
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/component-pass-1
          SKIP_TESTS: "1"
        run: bash ExistingIPAWorkspace/scripts/build-overlay-macos.sh

      - name: Build canonical reproducibility pass
        env:
          ARTIFACT_DIR: ${{ github.workspace }}/output/components
          SKIP_TESTS: "1"
        run: bash ExistingIPAWorkspace/scripts/build-overlay-macos.sh

      - name: Verify byte-for-byte reproducibility
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path

          first = Path(os.environ['RUNNER_TEMP']) / 'component-pass-1'
          second = Path('output/components')
          failures = []
          for name in (
              'ExistingIPAOverlay-ios-simulator-reproducible.zip',
              'ExistingIPAOverlay-ios-device-reproducible.zip',
          ):
              first_zip, second_zip = first / name, second / name
              first_manifest = json.loads((first / f'{name}.manifest.json').read_text())
              second_manifest = json.loads((second / f'{name}.manifest.json').read_text())
              first_members = {item['path']: item for item in first_manifest['members']}
              second_members = {item['path']: item for item in second_manifest['members']}
              changed = [
                  path for path in sorted(first_members.keys() | second_members.keys())
                  if first_members.get(path) != second_members.get(path)
              ]
              if first_zip.read_bytes() != second_zip.read_bytes() or changed:
                  detail = f'{name}: changed members: ' + (', '.join(changed) or '(ZIP metadata only)')
                  failures.append(detail)
                  print(f'NOT REPRODUCIBLE: {detail}')
              else:
                  print(f'REPRODUCIBLE: {name}')
          if failures:
              message = '%0A'.join(item.replace('%', '%25') for item in failures)
              print(f'::error title=Component reproducibility mismatch::{message}')
              raise SystemExit(1)
          PY

      - name: Validate canonical artifacts
        run: |
          python3 ExistingIPAWorkspace/scripts/validate-simulator-component.py \
            output/components/ExistingIPAOverlay-ios-simulator-reproducible.zip
          python3 ExistingIPAWorkspace/scripts/validate-device-component.py \
            output/components/ExistingIPAOverlay-ios-device-reproducible.zip
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root=Path('output/components')
          artifacts={}
          for platform in ('simulator','device'):
              path=root/f'ExistingIPAOverlay-ios-{platform}-reproducible.zip'
              artifacts[platform]={
                  'path': str(path),
                  'sizeBytes': path.stat().st_size,
                  'sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
              }
          report={
              'schemaVersion': 1,
              'workflowRun': int(os.environ['GITHUB_RUN_ID']),
              'commit': os.environ['GITHUB_SHA'],
              'coreTests': 'PASS',
              'uiTests': 'PASS',
              'swiftUIViewLifecycle': 'PASS',
              'resourceBundle': 'PASS',
              'localization': 'PASS',
              'persistence': 'PASS',
              'sampleHostIntegration': 'PASS',
              'simulatorBuild': 'PASS',
              'deviceBuild': 'PASS',
              'reproducibility': 'PASS',
              'prohibitedCapabilityScan': 'PASS',
              'artifacts': artifacts,
          }
          (root/'component-readiness-ci.json').write_text(json.dumps(report, indent=2, sort_keys=True)+'\n')
          print(json.dumps(report, indent=2, sort_keys=True))
          PY

      - name: Upload reproducible component artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ExistingIPAOverlay-reproducible-builds
          path: output/components/
          if-no-files-found: error
          retention-days: 30

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ExistingIPAOverlay-test-evidence
          path: output/test-results/
          if-no-files-found: warn
          retention-days: 14
